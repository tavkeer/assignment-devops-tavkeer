name: "CI - Pull Request Verification & Security Scans"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Tests & Quality Gate
  # -------------------------------------------------------------
  backend-ci:
    name: "Backend: Tests & Dependency Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Test Suite (Jest & Supertest)
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
        run: npm test

      - name: Audit Dependencies for Vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=high

  # -------------------------------------------------------------
  # Job 2: Frontend Build & Quality Gate
  # -------------------------------------------------------------
  frontend-ci:
    name: "Frontend: Build Verification & Dependency Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Vite SPA
        working-directory: frontend
        run: npm run build

      - name: Audit Dependencies for Vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

  # -------------------------------------------------------------
  # Job 3: Security Scan (Trivy Static & Secrets Scanner)
  # -------------------------------------------------------------
  security-scan:
    name: "Security: Trivy Vulnerability & Secret Scan"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  # -------------------------------------------------------------
  # Job 4: PR Summary & Failure Notification Hook
  # -------------------------------------------------------------
  pr-status:
    name: "PR Status Summary & Notifications"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-scan]
    if: always()

    steps:
      - name: Generate PR Step Summary
        run: |
          echo "## 🚀 Pull Request CI/CD Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Tests (22/22)** | ${{ needs.backend-ci.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build (Vite)** | ${{ needs.frontend-ci.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy Security Scan** | ${{ needs.security-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure (Slack / Webhook Hook)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "::warning title=CI Build Failed::One or more PR checks failed. Please check the logs."
          # If SLACK_WEBHOOK_URL secret is provided, send notification:
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"❌ *PR Build Failed* on branch `${{ github.head_ref }}`\n*Author:* ${{ github.actor }}\n*Commit:* `${{ github.sha }}`\n*Details:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              ${{ secrets.SLACK_WEBHOOK_URL }} || true
          fi
