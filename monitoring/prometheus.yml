global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "devops-backend-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: "backend-api"
          tier: "backend"

  - job_name: "devops-host-metrics"
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          env: "local"
